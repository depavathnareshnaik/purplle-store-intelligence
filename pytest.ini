[pytest]
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=70
    --cov-config=.coveragerc

markers =
    slow: marks tests as slow — skip with -m "not slow"

# Use a dedicated test database to keep production data untouched.
# Override with: TEST_DATABASE_URL=postgresql://... pytest
